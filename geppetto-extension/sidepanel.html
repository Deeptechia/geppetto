<!DOCTYPE html>
<html>

<head>
    <title>Geppetto AI Assistant</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="sidepanel.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container">
        <header>
            <h1>Geppetto AI Assistant</h1>
            <div class="provider-selector">
                <label for="ai-provider">Choose AI Provider:</label>
                <select id="ai-provider">
                    <option value="openai">OpenAI (GPT-4)</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="gemini">Google (Gemini)</option>
                </select>
            </div>
        </header>

        <div id="api-key-container">
            <div class="form-group">
                <label for="api-key">API Key:</label>
                <input type="password" id="api-key" placeholder="Enter your API key">
                <button id="save-key">Save</button>
            </div>
            <p class="hint">Your API key is stored locally in your browser.</p>
        </div>

        <div id="chat-container" class="hidden">
            <div id="messages" role="log" aria-live="polite"></div>

            <div class="page-content-toggle">
                <label class="toggle-switch">
                    <input type="checkbox" id="include-page-content">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Include page content in query</span>
            </div>

            <div class="input-area">
                <label for="user-input" class="sr-only"></label>
                <textarea id="user-input" placeholder="Type your message here..." rows="3"></textarea>
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
